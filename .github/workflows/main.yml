name: Build VMWatch Desktop Distribution (macOS)

on:
  workflow_dispatch:   # run manually from Actions tab

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('vmwatch_desktop/**/*.gradle*', 'vmwatch_desktop/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x vmwatch_desktop/gradlew

      - name: Build distribution
        run: ./gradlew packageDistributionForCurrentOS --no-daemon
        working-directory: vmwatch_desktop

      - name: Upload Compose artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VMWatchMacBuild
          path: vmwatch_desktop/composeApp/build/compose/binaries/**
